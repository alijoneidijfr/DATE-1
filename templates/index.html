{% extends "base.html" %}
{% block title %}دعوت به قرار{% endblock %}
{% block content %}
<div class="hero">
    <div class="card romantic-card">
        <div class="heart">💖</div>
        <div class="badge">یک دعوت خاص</div>
        <h1>با من میای سرِ قرار؟</h1>
        <p class="subtitle">یه قرار قشنگ می‌تونه شروع یه خاطره قشنگ‌تر باشه :)</p>
        <div class="actions" style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 30px;">
            <button id="noBtn" class="no-btn">نه</button>
            <a href="/arrange" class="yes-btn" style="text-decoration: none;">بله 💕</a>
        </div>
    </div>
</div>
<script>
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
        noBtn.style.position = 'absolute';
        noBtn.style.left = Math.random() * (window.innerWidth - noBtn.offsetWidth) + 'px';
        noBtn.style.top = Math.random() * (window.innerHeight - noBtn.offsetHeight) + 'px';
    });
</script>
<style>
    .no-btn { padding: 8px 16px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; color: #666; }
</style>
{% endblock %}
