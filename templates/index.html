{% extends "base.html" %}

{% block title %}دعوت به قرار{% endblock %}

{% block content %}
<div class="hero">
    <div class="card romantic-card">
        <div class="badge">دعوت ویژه</div>
        <h1>با من میای سرِ قرار؟</h1>
        <p class="subtitle">فقط یه جواب قشنگ می‌خوام :)</p>

        <div class="button-row">
            <button id="yesBtn" class="yes-btn" type="button">بله</button>
            <button id="noBtn" class="no-btn" type="button">نه</button>
        </div>

        <p id="message" class="message"></p>
    </div>
</div>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    let yesScale = 1;
    let noCount = 0;

    noBtn.addEventListener("click", () => {
        noCount += 1;
        yesScale += 0.18;

        yesBtn.style.transform = `scale(${yesScale})`;
        yesBtn.style.boxShadow = `0 14px 30px rgba(255, 105, 180, ${0.18 + noCount * 0.06})`;

        if (yesScale > 1.9) {
            noBtn.style.opacity = "0.35";
            noBtn.style.transform = "scale(0.85)";
            message.textContent = "فکر کنم جواب درست همون بله‌ست 💗";
        } else {
            const texts = [
                "یه بار دیگه فکر کن 😌",
                "هنوزم نظرت عوض نشده؟",
                "بله داره خوشگل‌تر میشه 🙂",
                "تقریباً رسیده‌ایم!",
            ];
            message.textContent = texts[Math.min(noCount - 1, texts.length - 1)];
        }
    });

    yesBtn.addEventListener("click", () => {
        window.location.href = "{{ url_for('book') }}";
    });
</script>
{% endblock %}
