{% extends "base.html" %}

{% block title %}انتخاب زمان قرار{% endblock %}

{% block content %}
<div class="hero">
    <div class="card romantic-card">
        <div class="heart">📅</div>
        
        <div class="badge">برنامه‌ریزی قرار</div>
        
        <h1>چه زمانی مناسبته؟</h1>
        
        <p class="subtitle">
            لطفاً تاریخ و ساعت مدنظرت رو انتخاب کن تا هماهنگ بشیم.
        </p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('arrange') }}" method="POST">
            <div class="form-group">
                <label for="date_input">تاریخ قرار <span class="required-mark">*</span></label>
                <input 
                    type="text" 
                    name="date" 
                    id="date_input" 
                    data-jdp 
                    data-jdp-only-date
                    data-jdp-min-date="1405/05/24"
                    data-jdp-max-date="1405/06/31"
                    placeholder="برای انتخاب تاریخ کلیک کن" 
                    autocomplete="off" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="time">ساعت قرار <span class="required-mark">*</span></label>
                <select name="time" id="time" required>
                    <option value="" disabled selected>ساعت را انتخاب کن</option>
                    <option value="09:00">۰۹:۰۰</option>
                    <option value="09:30">۰۹:۳۰</option>
                    <option value="10:00">۱۰:۰۰</option>
                    <option value="10:30">۱۰:۳۰</option>
                    <option value="11:00">۱۱:۰۰</option>
                    <option value="11:30">۱۱:۳۰</option>
                    <option value="12:00">۱۲:۰۰</option>
                    <option value="12:30">۱۲:۳۰</option>
                    <option value="13:00">۱۳:۰۰</option>
                    <option value="13:30">۱۳:۳۰</option>
                    <option value="14:00">۱۴:۰۰</option>
                    <option value="14:30">۱۴:۳۰</option>
                    <option value="15:00">۱۵:۰۰</option>
                    <option value="15:30">۱۵:۳۰</option>
                    <option value="16:00">۱۶:۰۰</option>
                    <option value="16:30">۱۶:۳۰</option>
                    <option value="17:00">۱۷:۰۰</option>
                    <option value="17:30">۱۷:۳۰</option>
                    <option value="18:00">۱۸:۰۰</option>
                </select>
            </div>

            <button type="submit" class="yes-btn full-width">
                مرحله بعد: انتخاب کافه 💕
            </button>
        </form>
    </div>
</div>

<!-- CSS و JS مربوط به تقویم -->
<link rel="stylesheet" href="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css">
<script src="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

<script>
    jalaliDatepicker.startWatch({
        minDate: "1405/05/24",
        maxDate: "1405/06/31",
        showTodayBtn: false,
        showEmptyBtn: false,
        autoNext: true
    });

    document.getElementById('date_input').addEventListener('keydown', function(e) {
        e.preventDefault();
    });
</script>

<style>
    select {
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e91e63' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: left 14px center;
        background-size: 16px;
    }

    #date_input {
        cursor: pointer;
        caret-color: transparent;
    }
</style>
{% endblock %}
