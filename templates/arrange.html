{% extends "base.html" %}

{% block title %}انتخاب تاریخ و ساعت{% endblock %}

{% block content %}
<div class="hero">
    <div class="card romantic-card">
        <div class="heart">🥰</div>

        <div class="badge">حالا زمانش رو انتخاب کنیم</div>

        <h1>خیلی خوشحال شدم که قبول کردی!</h1>

        <p class="subtitle">
            چه روز و ساعتی برات بهتره؟
        </p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('arrange') }}" method="POST">
            <div class="form-group">
                <label for="date_input">
                    تاریخ قرار <span class="required-mark">*</span>
                </label>

                <input
                    type="text"
                    name="date"
                    id="date_input"
                    data-jdp
                    data-jdp-only-date
                    data-jdp-min-date="1405/05/24"
                    data-jdp-max-date="1405/06/31"
                    placeholder="برای انتخاب تاریخ کلیک کن"
                    autocomplete="off"
                    readonly
                    required
                >
            </div>

            <div class="form-group">
                <label for="time_input">
                    ساعت قرار <span class="required-mark">*</span>
                </label>

                <select id="time_input" name="time" required>
                    <option value="" disabled selected>
                        ساعت را انتخاب کن
                    </option>

                    <option value="09:00">۰۹:۰۰</option>
                    <option value="09:30">۰۹:۳۰</option>
                    <option value="10:00">۱۰:۰۰</option>
                    <option value="10:30">۱۰:۳۰</option>
                    <option value="11:00">۱۱:۰۰</option>
                    <option value="11:30">۱۱:۳۰</option>
                    <option value="12:00">۱۲:۰۰</option>
                    <option value="12:30">۱۲:۳۰</option>
                    <option value="13:00">۱۳:۰۰</option>
                    <option value="13:30">۱۳:۳۰</option>
                    <option value="14:00">۱۴:۰۰</option>
                    <option value="14:30">۱۴:۳۰</option>
                    <option value="15:00">۱۵:۰۰</option>
                    <option value="15:30">۱۵:۳۰</option>
                    <option value="16:00">۱۶:۰۰</option>
                    <option value="16:30">۱۶:۳۰</option>
                    <option value="17:00">۱۷:۰۰</option>
                    <option value="17:30">۱۷:۳۰</option>
                    <option value="18:00">۱۸:۰۰</option>
                </select>
            </div>

            <button type="submit" class="yes-btn full-width">
                مرحله بعد: پیشنهاد کافه ☕
            </button>
        </form>
    </div>
</div>

<!-- نسخه مشخص و پایدار کتابخانه -->
<link
    rel="stylesheet"
    href="https://unpkg.com/@majidh1/jalalidatepicker@0.10.0/dist/jalalidatepicker.min.css"
>

<script src="https://unpkg.com/@majidh1/jalalidatepicker@0.10.0/dist/jalalidatepicker.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const dateInput = document.getElementById("date_input");

    if (!dateInput || typeof jalaliDatepicker === "undefined") {
        console.error("Jalali datepicker loaded incorrectly.");
        return;
    }

    /*
      بازه مجاز:
      شروع: ۱۴۰۵/۰۵/۲۴
      پایان: ۱۴۰۵/۰۶/۳۱
    */
    jalaliDatepicker.startWatch({
        minDate: "1405/05/24",
        maxDate: "1405/06/31",
        showTodayBtn: false,
        showEmptyBtn: false,
        autoHide: true,
        hideAfterChange: true
    });

    // جلوگیری از تایپ دستی
    dateInput.addEventListener("keydown", function (event) {
        event.preventDefault();
    });

    dateInput.addEventListener("paste", function (event) {
        event.preventDefault();
    });

    dateInput.addEventListener("drop", function (event) {
        event.preventDefault();
    });
});
</script>

<style>
    #date_input {
        cursor: pointer;
        caret-color: transparent;
    }

    .jdp-container,
    .jdp {
        z-index: 99999 !important;
    }

    .jdp-container {
        direction: rtl !important;
    }

    .form-group {
        position: relative;
    }

    select {
        cursor: pointer;
    }
</style>
{% endblock %}
