{% extends "base.html" %}

{% block title %}انتخاب تاریخ و ساعت{% endblock %}

{% block content %}
<div class="hero">
    <div class="card romantic-card">
        <div class="heart">🥰</div>

        <div class="badge">حالا زمانش رو انتخاب کنیم</div>

        <h1>خیلی خوشحال شدم که قبول کردی!</h1>

        <p class="subtitle">
            چه روز و ساعتی برات بهتره؟
        </p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('arrange') }}" method="POST">
            <div class="form-group">
                <label for="date_input">تاریخ قرار</label>

                <input
                    type="text"
                    name="date"
                    id="date_input"
                    data-jdp
                    placeholder="برای انتخاب تاریخ کلیک کن"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="time_input">ساعت قرار</label>

                <select id="time_input" name="time" required>
                    <option value="" disabled selected>
                        ساعت را انتخاب کن
                    </option>

                    {% for hour in range(9, 22) %}
                    <option value="{{ '%02d:00'|format(hour) }}">
                        {{ '%02d:00'|format(hour) }}
                    </option>

                    <option value="{{ '%02d:30'|format(hour) }}">
                        {{ '%02d:30'|format(hour) }}
                    </option>
                    {% endfor %}

                    <option value="22:00">22:00</option>
                </select>
            </div>

            <button type="submit" class="yes-btn full-width">
                مرحله بعد: پیشنهاد کافه ☕
            </button>
        </form>
    </div>
</div>

<link
    rel="stylesheet"
    href="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css"
>

<script src="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

<script>
(function () {
    // تنظیم محدودیت زمانی ثابت: ۲۴ مرداد ۱۴۰۵ تا ۳۱ شهریور ۱۴۰۵
    jalaliDatepicker.startWatch({
        minDate: "1405/05/24",
        maxDate: "1405/06/31"
    });
})();
</script>
{% endblock %}
