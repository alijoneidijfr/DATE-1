{% extends "base.html" %}

{% block title %}انتخاب تاریخ و ساعت{% endblock %}

{% block content %}

<style>
    .arrange-page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px 10px;
        background: linear-gradient(135deg, #ffe8f0, #fff7fa);
        direction: rtl;
        font-family: Tahoma, Arial, sans-serif;
    }

    .arrange-card {
        width: 100%;
        max-width: 375px;
        padding: 25px 24px 24px;
        background: #ffffff;
        border-radius: 22px;
        box-shadow: 0 8px 25px rgba(190, 86, 117, 0.16);
        text-align: right;
    }

    .arrange-emoji {
        margin-bottom: 15px;
        text-align: center;
        font-size: 38px;
        line-height: 1;
    }

    .arrange-badge {
        width: fit-content;
        margin: 0 auto 16px;
        padding: 6px 14px;
        border-radius: 20px;
        background: #fce8f0;
        color: #d6336c;
        font-size: 12px;
        font-weight: bold;
    }

    .arrange-title {
        margin: 0;
        color: #762247;
        text-align: center;
        font-size: 19px;
        line-height: 2;
        font-weight: bold;
    }

    .arrange-subtitle {
        margin: 6px 0 25px;
        color: #999096;
        text-align: center;
        font-size: 12px;
    }

    .arrange-form-group {
        margin-bottom: 17px;
    }

    .arrange-form-group label {
        display: block;
        margin-bottom: 8px;
        color: #762247;
        font-size: 13px;
        font-weight: bold;
    }

    .arrange-form-group input,
    .arrange-form-group select {
        width: 100%;
        height: 47px;
        box-sizing: border-box;
        padding: 0 13px;
        border: 1px solid #e9bdcf;
        border-radius: 11px;
        outline: none;
        background: #ffffff;
        color: #6f6870;
        font-family: Tahoma, Arial, sans-serif;
        font-size: 13px;
        transition: 0.2s;
    }

    .arrange-form-group input::placeholder {
        color: #b8afb4;
    }

    .arrange-form-group input:focus,
    .arrange-form-group select:focus {
        border-color: #dc4f80;
        box-shadow: 0 0 0 3px rgba(220, 79, 128, 0.1);
    }

    .arrange-form-group select {
        cursor: pointer;
        direction: rtl;
    }

    .arrange-error {
        margin-bottom: 15px;
        padding: 9px;
        border-radius: 9px;
        background: #fff0f3;
        color: #c52d5f;
        text-align: center;
        font-size: 12px;
    }

    .arrange-submit {
        width: 100%;
        height: 43px;
        margin-top: 10px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(90deg, #e71969, #d71362);
        color: #ffffff;
        font-family: Tahoma, Arial, sans-serif;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 7px 14px rgba(215, 19, 98, 0.2);
        transition: 0.2s;
    }

    .arrange-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 9px 18px rgba(215, 19, 98, 0.3);
    }

    @media (max-width: 400px) {
        .arrange-page {
            padding: 8px;
        }

        .arrange-card {
            padding: 24px 20px;
        }

        .arrange-title {
            font-size: 18px;
        }
    }
</style>

<div class="arrange-page">
    <div class="arrange-card">

        <div class="arrange-emoji">🥰</div>

        <div class="arrange-badge">
            حالا زمانش رو انتخاب کنیم
        </div>

        <h1 class="arrange-title">
            خیلی خوشحال شدم که قبول کردی!
        </h1>

        <p class="arrange-subtitle">
            چه روز و ساعتی برات بهتره؟
        </p>

        {% if error %}
        <div class="arrange-error">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('arrange') }}" method="POST" id="arrange-form">

            <div class="arrange-form-group">
                <label for="date_input">
                    تاریخ قرار
                </label>

                <input
                    type="text"
                    name="date"
                    id="date_input"
                    data-jdp
                    data-jdp-min-date="1405/05/24"
                    data-jdp-max-date="1405/06/06"
                    placeholder="برای انتخاب تاریخ کلیک کن"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="arrange-form-group">
                <label for="time_input">
                    ساعت قرار
                </label>

                <select id="time_input" name="time" required>
                    <option value="" disabled selected>
                        ساعت را انتخاب کن
                    </option>

                    {% for hour in range(9, 22) %}
                    <option value="{{ '%02d:00'|format(hour) }}">
                        {{ '%02d:00'|format(hour) }}
                    </option>

                    <option value="{{ '%02d:30'|format(hour) }}">
                        {{ '%02d:30'|format(hour) }}
                    </option>
                    {% endfor %}

                    <option value="22:00">22:00</option>
                </select>
            </div>

            <button type="submit" class="arrange-submit">
                مرحله بعد: پیشنهاد کافه ☕
            </button>

        </form>
    </div>
</div>

<!-- کتابخانه تقویم شمسی -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/jalalidatepicker@0.11.1/dist/jalalidatepicker.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/jalalidatepicker@0.11.1/dist/jalalidatepicker.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const dateInput = document.getElementById("date_input");
    const form = document.getElementById("arrange-form");

    const MIN_DATE = "1405/05/24";
    const MAX_DATE = "1405/06/06";

    function convertPersianDigits(value) {
        const persianDigits = "۰۱۲۳۴۵۶۷۸۹";
        const arabicDigits = "٠١٢٣٤٥٦٧٨٩";

        return value
            .replace(/[۰-۹]/g, function (digit) {
                return persianDigits.indexOf(digit);
            })
            .replace(/[٠-٩]/g, function (digit) {
                return arabicDigits.indexOf(digit);
            });
    }

    function normalizeDate(value) {
        return convertPersianDigits(value || "")
            .replace(/-/g, "/")
            .replace(/\s/g, "")
            .trim();
    }

    function isValidDateFormat(value) {
        return /^1405\/(05|06)\/\d{2}$/.test(value);
    }

    function isDateInRange(value) {
        const date = normalizeDate(value);

        if (!isValidDateFormat(date)) {
            return false;
        }

        return date >= MIN_DATE && date <= MAX_DATE;
    }

    if (typeof jalaliDatepicker !== "undefined") {
        jalaliDatepicker.startWatch({
            minDate: MIN_DATE,
            maxDate: MAX_DATE
        });
    } else {
        console.error("Jalali Datepicker بارگذاری نشده است.");
    }

    form.addEventListener("submit", function (event) {
        const selectedDate = normalizeDate(dateInput.value);

        if (!isDateInRange(selectedDate)) {
            event.preventDefault();

            dateInput.setCustomValidity(
                "لطفاً تاریخی بین ۱۴۰۵/۰۵/۲۴ تا ۱۴۰۵/۰۶/۰۶ انتخاب کنید."
            );

            dateInput.reportValidity();
            return;
        }

        dateInput.value = selectedDate;
        dateInput.setCustomValidity("");
    });

    dateInput.addEventListener("input", function () {
        const selectedDate = normalizeDate(dateInput.value);

        if (selectedDate && !isDateInRange(selectedDate)) {
            dateInput.setCustomValidity(
                "این تاریخ خارج از بازه مجاز است."
            );
        } else {
            dateInput.setCustomValidity("");
        }
    });
});
</script>

{% endblock %}
