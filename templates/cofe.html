{% extends "base.html" %}
{% block content %}
<div class="hero">
    <div class="card romantic-card" style="width: min(800px, 95%);">
        <div class="badge">کجا بریم؟ ☕</div>
        <h1>پیشنهادت برای کافه چیه؟</h1>
        
        <form action="{{ url_for('submit_final') }}" method="POST">
            <input type="hidden" name="date" value="{{ date }}">
            <input type="hidden" name="time" value="{{ time }}">
            <input type="hidden" name="lat" id="lat">
            <input type="hidden" name="lng" id="lng">

            <div class="row" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>اسم کافه:</label>
                    <input type="text" name="cafe_name" placeholder="مثلاً کافه وصال" required>
                </div>
                <div style="flex: 1;">
                    <label>کدوم محله؟</label>
                    <input type="text" name="cafe_area" placeholder="مثلاً سعادت‌آباد" required>
                </div>
            </div>

            <label>اگه لوکیشن دقیق داری روی نقشه بزن:</label>
            <div id="map" style="height: 250px; border-radius: 15px; margin-bottom: 20px; border: 2px solid var(--soft);"></div>

            <button type="submit" class="yes-btn" style="width: 100%;">ثبت نهایی قرار 💗</button>
        </form>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([35.6892, 51.3890], 12); // مرکز تهران
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var marker;

    map.on('click', function(e) {
        if (marker) { map.removeLayer(marker); }
        marker = L.marker(e.latlng).addTo(map);
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
    });
</script>
{% endblock %}
