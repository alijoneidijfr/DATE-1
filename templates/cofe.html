{% extends "base.html" %}
{% block content %}
<div class="hero">
    <div class="card romantic-card">
        <h1>پیشنهادت برای کافه چیه؟ ☕</h1>
        <form action="{{ url_for('submit_final') }}" method="POST">
            <input type="hidden" name="date" value="{{ date }}">
            <input type="hidden" name="time" value="{{ time }}">
            
            <div class="form-group">
                <input type="text" name="cafe_name" placeholder="نام کافه (اختیاری)">
            </div>
            <div class="form-group">
                <input type="text" name="cafe_area" placeholder="محله (اختیاری)">
            </div>
            
            <div id="map" style="height: 200px; margin-bottom: 15px; border-radius: 10px;"></div>
            <input type="hidden" name="lat" id="lat">
            <input type="hidden" name="lng" id="lng">

            <div class="form-group">
                <label>شماره تماس برای هماهنگی:</label>
                <input type="tel" name="phone" value="+989190118068" required>
            </div>

            <button type="submit" class="yes-btn">ثبت نهایی قرار 💕</button>
        </form>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([35.6892, 51.3890], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var marker;
    map.on('click', function(e) {
        if (marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
    });
</script>
{% endblock %}
