{% extends "base.html" %}

{% block title %}انتخاب کافه{% endblock %}

{% block content %}
<div class="hero">
    <div class="card romantic-card cafe-card">
        <div class="heart">☕</div>
        <h1>پیشنهادت برای کافه چیه؟</h1>

        <form action="{{ url_for('submit_final') }}" method="POST">
            <input type="hidden" name="date" value="{{ date }}">
            <input type="hidden" name="time" value="{{ time }}">
            <input type="hidden" name="lat" id="lat" value="">
            <input type="hidden" name="lng" id="lng" value="">

            <div class="cafe-fields">
                <div class="form-group">
                    <label for="cafe_name">نام کافه <span style="color:red;">*</span></label>
                    <input id="cafe_name" type="text" name="cafe_name" required placeholder="نام کافه را وارد کن">
                </div>

                <div class="form-group">
                    <label for="cafe_area">محله <span style="color:red;">*</span></label>
                    <input id="cafe_area" type="text" name="cafe_area" required placeholder="محله کافه را وارد کن">
                </div>
            </div>

            <div class="cafe-box">
                <p class="map-title">لوکیشن کافه (اختیاری)</p>
                <p class="map-hint">اگر دوست داری، روی نقشه انتخابش کن 📍</p>
                <div id="map"></div>
            </div>

            <!-- فیلد شماره تماس با استایل کم‌رنگ -->
            <div class="phone-box light-field">
                <label for="phone">شماره تماس جهت هماهنگی (پیشنهادی)</label>
                <input id="phone" type="tel" name="phone" value="+989190118068" required>
            </div>

            <div class="confirm-box">
                <label class="checkbox-label">
                    <input type="checkbox" required>
                    <span>اطلاعات قرار را تأیید می‌کنم.</span>
                </label>
            </div>

            <button type="submit" class="yes-btn full-width">ثبت نهایی قرار 💕</button>
        </form>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map("map").setView([35.6892, 51.3890], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    let marker = null;
    map.on("click", function (event) {
        if (marker) map.removeLayer(marker);
        marker = L.marker(event.latlng).addTo(map);
        document.getElementById("lat").value = event.latlng.lat;
        document.getElementById("lng").value = event.latlng.lng;
    });
</script>
{% endblock %}
