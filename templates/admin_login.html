{% extends "base.html" %}

{% block title %}ورود مدیر{% endblock %}

{% block content %}
<div class="hero">
    <div class="card romantic-card">
        <div class="badge">ورود مدیر</div>
        <h1>ورود به پنل مدیریت</h1>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form class="booking-form" method="post">
            <label>
                رمز عبور
                <input
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button class="yes-btn full-width" type="submit">
                ورود به پنل
            </button>
        </form>
    </div>
</div>
{% endblock %}
