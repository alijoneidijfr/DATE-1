{% extends "base.html" %}

{% block title %}ورود مدیر{% endblock %}

{% block content %}
<div class="hero">
    <div class="card romantic-card" style="max-width: 430px; width: 92%;">
        <div class="heart">🔐</div>

        <div class="badge">پنل مدیریت</div>

        <h1>ورود مدیر</h1>

        <p class="subtitle">
            برای مشاهده رزروها رمز عبور را وارد کن.
        </p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form class="booking-form" method="POST" action="{{ url_for('admin') }}">
            <label for="password">رمز عبور</label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button class="yes-btn full-width" type="submit">
                ورود به پنل
            </button>
        </form>
    </div>
</div>
{% endblock %}
